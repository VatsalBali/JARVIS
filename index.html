<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORACLE</title>
<style>
  :root {
    --bg: #060a10;
    --panel: #0b111a;
    --panel-alt: #0e1520;
    --line: #1c2733;
    --line-bright: #2c4353;
    --accent: #5fd8e8;
    --accent-dim: #2c5560;
    --accent-glow: rgba(95, 216, 232, 0.35);
    --text: #e7f1f5;
    --text-dim: #6f8794;
    --text-faint: #3f515c;
    --warn: #e8b45f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  .mono { font-family: "Consolas", "SF Mono", monospace; }

  .shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100%;
    transition: grid-template-columns 0.2s ease;
  }
  .shell.sidebar-collapsed {
    grid-template-columns: 0px 1fr;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 14px;
    flex-shrink: 0;
  }

  .brand {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  .icon-btn {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint);
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-dim); }
  #closeBtn:hover { background: rgba(232, 95, 95, 0.15); color: #e85f5f; }

  .new-chat-btn {
    margin: 4px 14px 10px;
    padding: 9px 12px;
    background: var(--panel-alt);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .new-chat-btn:hover { border-color: var(--accent-dim); }

  .sidebar-search {
    margin: 0 14px 14px;
    -webkit-app-region: no-drag;
  }
  .sidebar-search input {
    width: 100%;
    background: var(--panel-alt);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  .sidebar-search input:focus { border-color: var(--accent-dim); }
  .sidebar-search input::placeholder { color: var(--text-faint); }

  .sidebar-section-label {
    padding: 0 18px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px;
    -webkit-app-region: no-drag;
  }

  .project-list {
    max-height: 130px;
    overflow-y: auto;
    padding: 0 10px 8px;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }

  .chat-list-empty {
    padding: 10px 8px;
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.5;
  }

  .chat-list-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 6px 8px 10px;
    border-radius: 6px;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
  }
  .chat-list-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .chat-list-item.active {
    background: rgba(95, 216, 232, 0.08);
    color: var(--text);
    border-left: 2px solid var(--accent);
  }

  .chat-list-item .item-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .item-menu-btn {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: var(--text-faint);
    font-size: 13px;
    opacity: 0;
  }
  .chat-list-item:hover .item-menu-btn { opacity: 1; }
  .item-menu-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  .item-context-menu {
    position: fixed;
    background: var(--panel-alt);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    min-width: 140px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 1000;
  }
  .item-context-menu .menu-option {
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .item-context-menu .menu-option:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .item-context-menu .menu-option.danger { color: #e85f5f; }
  .item-context-menu .menu-option.danger:hover { background: rgba(232, 95, 95, 0.12); }

  /* ============ MAIN ============ */
  .main {
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    flex-shrink: 0;
  }

  .clock {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }

  .top-ring-slot {
    margin-left: auto;
    margin-right: auto;
  }

  /* ============ RING (shared element, relocated between hero/topbar) ============ */
  #ringWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    -webkit-app-region: no-drag;
  }

  .ring {
    width: 180px;
    height: 180px;
    cursor: pointer;
    transition: filter 0.2s ease, width 0.25s ease, height 0.25s ease;
  }
  .ring:hover { filter: drop-shadow(0 0 12px var(--accent-glow)); }

  .active-chat .ring {
    width: 40px;
    height: 40px;
  }

  .hud-core-glow { opacity: 0.5; }
  .hud-outer {
    fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round;
    opacity: 0.85; transform-origin: 100px 100px;
  }
  .hud-ticks { stroke: var(--accent); stroke-width: 1.4; opacity: 0.55; transform-origin: 100px 100px; }
  .hud-inner-ring { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.4; transform-origin: 100px 100px; }
  .hud-spikes { stroke: var(--accent); stroke-width: 1.2; opacity: 0.6; }
  .hud-dots { fill: var(--accent); opacity: 0.7; }

  .ring:not(.thinking) .hud-outer { animation: hudRotate 40s linear infinite; }
  .ring:not(.thinking) .hud-ticks { animation: hudRotate 60s linear infinite reverse; }
  .ring:not(.thinking) .hud-inner-ring { animation: hudRotate 50s linear infinite; }
  .ring:not(.thinking) .hud-core-glow { animation: hudPulseIdle 3.6s ease-in-out infinite; }
  .ring.thinking .hud-outer { animation: hudRotate 6s linear infinite; opacity: 1; }
  .ring.thinking .hud-ticks { animation: hudRotate 9s linear infinite reverse; opacity: 0.8; }
  .ring.thinking .hud-inner-ring { animation: hudRotate 7s linear infinite; }
  .ring.thinking .hud-core-glow { animation: hudPulseThinking 1s ease-in-out infinite; }

  @keyframes hudRotate { to { transform: rotate(360deg); } }
  @keyframes hudPulseIdle { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.6; } }
  @keyframes hudPulseThinking { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }

  .ring-status {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    min-height: 12px;
  }
  .active-chat .ring-status { font-size: 9px; }

  /* ============ HERO (empty state) ============ */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 20px;
    overflow-y: auto;
  }

  .hero-greeting {
    font-size: 30px;
    font-weight: 500;
    color: var(--text);
    margin: 0;
  }

  .hero-input-box {
    width: 100%;
    max-width: 620px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .hero-input-box:focus-within { border-color: var(--accent-dim); }

  .hero-input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .hero-input-box input::placeholder { color: var(--text-faint); }

  .agent-select {
    background: var(--panel-alt);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: inherit;
    padding: 6px 8px;
    outline: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sidebar-top .agent-select {
    margin-left: auto;
  }
  .agent-select:hover, .agent-select:focus { border-color: var(--accent-dim); color: var(--text); }
  .agent-select option { background: var(--panel-alt); color: var(--text); }

  .suggestions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 620px;
  }

  .suggestion-chip {
    background: var(--panel-alt);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .suggestion-chip:hover { border-color: var(--accent-dim); color: var(--text); }

  /* ============ ACTIVE CHAT VIEW ============ */
  .chat-view {
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
  }

  .conv-log {
    overflow-y: auto;
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .entry { display: flex; gap: 10px; }

  .avatar {
    width: 20px; height: 20px;
    border: 1px solid var(--line-bright);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    font-family: "Consolas", "SF Mono", monospace;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .entry.jarvis .avatar { color: var(--accent); border-color: var(--accent-dim); }
  .entry.user .avatar { color: var(--warn); border-color: #6b5730; }

  .entry-body .entry-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; }
  .entry-head .who { font-size: 10px; letter-spacing: 1px; font-family: "Consolas", "SF Mono", monospace; }
  .entry.jarvis .who { color: var(--accent); }
  .entry.user .who { color: var(--warn); }
  .entry-head .time { font-size: 9px; color: var(--text-faint); }

  .entry-content { font-size: 13px; line-height: 1.6; color: var(--text); }
  .entry-content p { margin: 0 0 10px; }
  .entry-content p:last-child { margin-bottom: 0; }
  .entry-content ul, .entry-content ol { margin: 0 0 10px; padding-left: 20px; }
  .entry-content li { margin-bottom: 4px; }
  .entry-content h3, .entry-content h4 { margin: 0 0 8px; color: var(--accent); font-weight: 600; }
  .entry-content h3 { font-size: 15px; }
  .entry-content h4 { font-size: 13px; }
  .entry-content .inline-code {
    background: var(--panel-alt); border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 5px; font-family: "Consolas", "SF Mono", monospace; font-size: 12px; color: var(--accent);
  }
  .entry-content .code-block {
    background: var(--panel-alt); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; margin: 0 0 10px; overflow-x: auto;
    font-family: "Consolas", "SF Mono", monospace; font-size: 12px; color: var(--text); white-space: pre;
  }

  /* ============ INPUT BAR (active chat) ============ */
  .input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .input-bracket { color: var(--text-faint); font-size: 13px; }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    padding: 8px 0;
  }
  #input::placeholder { color: var(--text-faint); }

  .input-icon { color: var(--text-faint); font-size: 13px; cursor: default; }
  .input-icon.send { color: var(--accent); cursor: pointer; }
  .input-icon.mic { cursor: pointer; }
  .input-icon.mic.recording { color: #e85f5f; animation: micPulse 1s ease-in-out infinite; }
  @keyframes micPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>

<div class="shell" id="shell">

  <div class="sidebar" id="sidebar">
    <div class="sidebar-top pywebview-drag-region">
      <span class="icon-btn" id="sidebarToggle" title="Collapse sidebar">&#9776;</span>
      <span class="brand mono">ORACLE</span>
      <select class="agent-select" id="agentSelect" title="Active agent - stays selected until you change it">
        <option value="main">Main</option>
        <option value="coding">Coding</option>

    <div class="sidebar-section-label" style="display:flex; align-items:center; justify-content:space-between; padding-right:14px;">

              <circle cx="141.34" cy="120.17" r="1.1"/>
              <circle cx="136.25" cy="128.32" r="1.1"/>
              <circle cx="129.57" cy="135.24" r="1.1"/>
              <circle cx="121.6" cy="140.62" r="1.1"/>
            </g>
          </svg>
          <div class="ring-status mono" id="ringStatus"></div>
        </div>
      </div>

      <h1 class="hero-greeting" id="heroGreeting">Hello</h1>

      <div class="hero-input-box">
        <input id="heroInput" type="text" placeholder="How can I help you today?" autofocus>
        <span class="input-icon mic" id="heroMicBtn" title="Voice input">&#127908;</span>
        <span class="input-icon send" id="heroSendBtn">&#10148;</span>
      </div>

      <div class="suggestions">
        <div class="suggestion-chip" data-msg="What can you help me with?">What can you help me with?</div>
        <div class="suggestion-chip" data-msg="What's my current system status?">Check my system status</div>
        <div class="suggestion-chip" data-msg="Open Chrome">Open Chrome</div>
      </div>
    </div>

    <div class="chat-view" id="chatView" style="display:none;">
      <div class="conv-log" id="log"></div>
      <div class="input-bar">
        <span class="input-bracket mono">&gt;</span>
        <input id="input" type="text" placeholder="Type a message...">
        <span class="input-icon mic" id="micBtn" title="Voice input">&#127908;</span>
        <span class="input-icon send" id="sendBtn">&#10148;</span>
      </div>
    </div>
  </div>

</div>

<script>
  // ---------------------------------------------------------------------
  // Minimal markdown -> HTML renderer for ORACLE's replies.
  // ---------------------------------------------------------------------
  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMarkdown(raw) {
    const codeBlocks = [];
    let text = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const idx = codeBlocks.length;
      codeBlocks.push(code.replace(/\n$/, ''));
      return `\u0000CODEBLOCK${idx}\u0000`;
    });
    text = escapeHtml(text);
    text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');

    const blocks = text.split(/\n{2,}/);
    return blocks.map(block => {
      const lines = block.split('\n').filter(l => l.trim() !== '');
      if (lines.length === 0) return '';
      const codeMatch = block.trim().match(/^\u0000CODEBLOCK(\d+)\u0000$/);
      if (codeMatch) {
        const code = codeBlocks[parseInt(codeMatch[1], 10)];
        return `<pre class="code-block"><code>${escapeHtml(code)}</code></pre>`;
      }
      if (/^###\s+/.test(lines[0]) && lines.length === 1) return `<h4>${lines[0].replace(/^###\s+/, '')}</h4>`;
      if (/^##\s+/.test(lines[0]) && lines.length === 1) return `<h3>${lines[0].replace(/^##\s+/, '')}</h3>`;
      if (lines.every(l => /^[-*•]\s+/.test(l.trim()))) {
        return `<ul>${lines.map(l => `<li>${l.trim().replace(/^[-*•]\s+/, '')}</li>`).join('')}</ul>`;
      }
      if (lines.every(l => /^\d+\.\s+/.test(l.trim()))) {
        return `<ol>${lines.map(l => `<li>${l.trim().replace(/^\d+\.\s+/, '')}</li>`).join('')}</ol>`;
      }
      return `<p>${lines.join('<br>')}</p>`;
    }).join('');
  }

  function pad(n) { return n.toString().padStart(2, '0'); }

  // ---- Clock ----
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);

  // ---- Time-of-day greeting (purely cosmetic, no backend call) ----
  (function setGreeting() {
    const h = new Date().getHours();
    let text = 'Good evening';
    if (h < 5) text = 'Good night';
    else if (h < 12) text = 'Good morning';
    else if (h < 18) text = 'Good afternoon';
    document.getElementById('heroGreeting').textContent = text;
  })();

  // ---- Ring status/thinking helpers, called from Python via evaluate_js ----
  function setRingStatus(text) {
    document.getElementById('ringStatus').textContent = text;
  }
  function setRingThinking(isThinking) {
    document.getElementById('ring').classList.toggle('thinking', isThinking);
  }

  const shell = document.getElementById('shell');
  const hero = document.getElementById('hero');
  const chatView = document.getElementById('chatView');
  const log = document.getElementById('log');
  const heroRingSlot = document.getElementById('heroRingSlot');
  const topRingSlot = document.getElementById('topRingSlot');
  const ringWrap = document.getElementById('ringWrap');
  const agentSelect = document.getElementById('agentSelect');
  const ring = document.getElementById('ring');

  let isActiveChat = false;

  function enterActiveChat() {
    if (isActiveChat) return;
    isActiveChat = true;
    document.body.classList.add('active-chat');
    hero.style.display = 'none';
    chatView.style.display = 'grid';
    topRingSlot.appendChild(ringWrap);
    document.getElementById('input').focus();
  }

  function enterHero() {
    isActiveChat = false;
    document.body.classList.remove('active-chat');
    hero.style.display = 'flex';
    chatView.style.display = 'none';
    heroRingSlot.appendChild(ringWrap);
    log.innerHTML = '';
    document.getElementById('heroInput').focus();
  }

  function addMessage(role, text) {
    enterActiveChat();

    const entry = document.createElement('div');
    entry.className = 'entry ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'Y' : 'O';

    const body = document.createElement('div');
    body.className = 'entry-body';

    const head = document.createElement('div');
    head.className = 'entry-head';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = role === 'user' ? 'YOU' : 'ORACLE';
    const time = document.createElement('span');
    time.className = 'time';
    const d = new Date();
    time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    head.appendChild(who);
    head.appendChild(time);

    const contentEl = document.createElement('div');
    contentEl.className = 'entry-content';
    if (role === 'jarvis') {
      contentEl.innerHTML = renderMarkdown(text);
    } else {
      contentEl.textContent = text;
    }

    body.appendChild(head);
    body.appendChild(contentEl);
    entry.appendChild(avatar);
    entry.appendChild(body);
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage(text) {
    text = (text || '').trim();
    if (!text) return;
    addMessage('user', text);
    try {
      const reply = await window.pywebview.api.send_message(text);
      addMessage('jarvis', reply);
    } catch (err) {
      addMessage('jarvis', 'I encountered an error: ' + err);
    }
    // This send just touched a conversation (created or continued one),
    // so it's necessarily the most-recently-updated one once refreshed -
    // list_conversations orders by that, so it's first in the list.
    await refreshChatList();
    if (allConversations.length > 0) {
      activeConversationId = allConversations[0].id;
      renderChatList(allConversations);
    }
  }

  // ---- Hero input/mic/send ----
  const heroInput = document.getElementById('heroInput');
  const heroSendBtn = document.getElementById('heroSendBtn');
  const heroMicBtn = document.getElementById('heroMicBtn');

  heroInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = heroInput.value;
      heroInput.value = '';
      sendMessage(text);
    }
  });
  heroSendBtn.addEventListener('click', () => {
    const text = heroInput.value;
    heroInput.value = '';
    sendMessage(text);
  });

  document.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => sendMessage(chip.dataset.msg));
  });

  // ---- Active-chat input/mic/send ----
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = input.value;
      input.value = '';
      sendMessage(text);
    }
  });
  sendBtn.addEventListener('click', () => {
    const text = input.value;
    input.value = '';
    sendMessage(text);
  });

  // Shared mic recording logic - used by both hero and active-chat mic buttons.
  function wireMicButton(btn, targetInput) {
    let isRecording = false;
    btn.addEventListener('click', async () => {
      if (!isRecording) {
        isRecording = true;
        btn.classList.add('recording');
        try {
          await window.pywebview.api.start_recording();
        } catch (err) {
          console.error('start_recording failed:', err);
          isRecording = false;
          btn.classList.remove('recording');
        }
      } else {
        isRecording = false;
        btn.classList.remove('recording');
        try {
          const text = await window.pywebview.api.stop_recording();
          if (text && !text.startsWith('Error:')) {
            targetInput.value = text;
            targetInput.focus();
          } else if (text) {
            console.warn('Transcription issue:', text);
          }
        } catch (err) {
          console.error('stop_recording failed:', err);
        }
      }
    });
  }
  wireMicButton(heroMicBtn, heroInput);
  wireMicButton(micBtn, input);

  // ---- Ring click -> voice turn ----
  ring.addEventListener('click', async () => {
    try { await window.pywebview.api.start_voice_turn(); } catch (err) { console.error(err); }
  });

  // ---- Sidebar controls ----
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    shell.classList.toggle('sidebar-collapsed');
  });

  // Persistent agent switch - unlike the old per-message dropdown, this
  // actually changes ORACLE's active mode until changed again. Mirrors
  // "+ New chat": drops into a fresh hero state, but for the newly
  // selected agent, and the sidebar's Chats list now shows only that
  // agent's threads (list_conversations is agent-scoped server-side).
  agentSelect.addEventListener('change', async () => {
    try {
      await window.pywebview.api.switch_agent(agentSelect.value);
    } catch (err) {
      console.error('switch_agent failed:', err);
      return;
    }
    enterHero();
    clearProjectModeUI();
    activeConversationId = null;
    refreshChatList();
  });

  document.getElementById('newChatBtn').addEventListener('click', async () => {
    try { await window.pywebview.api.new_chat(); } catch (err) { console.error(err); }
    enterHero();
    clearProjectModeUI();
    // Nothing is active until the next message is actually sent - clear
    // the highlight rather than leaving the previous chat looking active.
    activeConversationId = null;
    refreshChatList();
  });

  const chatList = document.getElementById('chatList');
  let activeConversationId = null;
  let allConversations = [];

  // Shared floating context menu, used by both chat and project list items.
  function showContextMenu(x, y, options) {
    document.querySelectorAll('.item-context-menu').forEach(m => m.remove());
    const menu = document.createElement('div');
    menu.className = 'item-context-menu';
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    options.forEach(opt => {
      const el = document.createElement('div');
      el.className = 'menu-option' + (opt.danger ? ' danger' : '');
      el.textContent = opt.label;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.remove();
        opt.onClick();
      });
      menu.appendChild(el);
    });
    document.body.appendChild(menu);
    // Deferred so the same click that opened the menu doesn't immediately
    // trigger this outside-click listener and close it right away.
    setTimeout(() => {
      const closeHandler = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeHandler);
        }
      };
      document.addEventListener('click', closeHandler);
    }, 0);
  }

  function renderChatList(conversations) {
    chatList.innerHTML = '';
    if (conversations.length === 0) {
      chatList.innerHTML = '<div class="chat-list-empty">No past conversations yet.</div>';
      return;
    }
    conversations.forEach(conv => {
      const item = document.createElement('div');
      item.className = 'chat-list-item' + (conv.id === activeConversationId ? ' active' : '');
      item.title = conv.title;

      const titleSpan = document.createElement('span');
      titleSpan.className = 'item-title';
      titleSpan.textContent = (conv.pinned ? '\u{1F4CC} ' : '') + conv.title;
      item.appendChild(titleSpan);

      const menuBtn = document.createElement('span');
      menuBtn.className = 'item-menu-btn';
      menuBtn.textContent = '\u22EE';
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = menuBtn.getBoundingClientRect();
        showContextMenu(rect.left, rect.bottom + 4, [
          {
            label: conv.pinned ? 'Unpin' : 'Pin',
            onClick: async () => {
              await window.pywebview.api.toggle_pin_conversation(conv.id);
              refreshChatList();
            },
          },
          {
            label: 'Rename',
            onClick: async () => {
              const newTitle = prompt('Rename chat:', conv.title);
              if (newTitle && newTitle.trim()) {
                await window.pywebview.api.rename_conversation(conv.id, newTitle.trim());
                refreshChatList();
              }
            },
          },
          {
            label: 'Delete',
            danger: true,
            onClick: async () => {
              if (confirm(`Delete "${conv.title}"? This cannot be undone.`)) {
                await window.pywebview.api.delete_conversation(conv.id);
                if (conv.id === activeConversationId) {
                  activeConversationId = null;
                  enterHero();
                }
                refreshChatList();
              }
            },
          },
        ]);
      });
      item.appendChild(menuBtn);

      item.addEventListener('click', async () => {
        try {
          const messages = await window.pywebview.api.load_chat(conv.id);
          activeConversationId = conv.id;
          clearProjectModeUI();
          log.innerHTML = '';
          enterActiveChat();
          messages.forEach(m => addMessage(m.role, m.content));
          renderChatList(allConversations);
        } catch (err) {
          console.error('load_chat failed:', err);
        }
      });
      chatList.appendChild(item);
    });
  }

  async function refreshChatList() {
    try {
      allConversations = await window.pywebview.api.list_conversations();
      renderChatList(allConversations);
    } catch (err) {
      console.error('list_conversations failed:', err);
    }
  }

  document.getElementById('searchChats').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    renderChatList(allConversations.filter(c => c.title.toLowerCase().includes(q)));
  });

  refreshChatList();

  // ---- Projects ----
  const projectList = document.getElementById('projectList');
  let activeProjectPath = null;

  function renderProjectList(projects) {
    projectList.innerHTML = '';
    if (projects.length === 0) {
      projectList.innerHTML = '<div class="chat-list-empty">No projects found in the selected folder.</div>';
      return;
    }
    projects.forEach(proj => {
      const item = document.createElement('div');
      item.className = 'chat-list-item' + (proj.path === activeProjectPath ? ' active' : '');
      item.title = proj.path;

      const titleSpan = document.createElement('span');
      titleSpan.className = 'item-title';
      titleSpan.textContent = (proj.pinned ? '\u{1F4CC} ' : '\u{1F4C1} ') + proj.name;
      item.appendChild(titleSpan);

      const menuBtn = document.createElement('span');
      menuBtn.className = 'item-menu-btn';
      menuBtn.textContent = '\u22EE';
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = menuBtn.getBoundingClientRect();
        showContextMenu(rect.left, rect.bottom + 4, [
          {
            label: proj.pinned ? 'Unpin' : 'Pin',
            onClick: async () => {
              await window.pywebview.api.toggle_pin_project(proj.id);
              refreshProjectList();
            },
          },
          {
            label: 'Rename',
            onClick: async () => {
              const newName = prompt('Rename project (display name only - the actual folder is untouched):', proj.name);
              if (newName && newName.trim()) {
                await window.pywebview.api.rename_project(proj.id, newName.trim());
                refreshProjectList();
              }
            },
          },
          {
            label: 'Delete',
            danger: true,
            onClick: async () => {
              if (confirm(`Remove "${proj.name}" from ORACLE? This only clears its chat memory here - your actual folder and files are never touched.`)) {
                await window.pywebview.api.delete_project(proj.id);
                if (proj.path === activeProjectPath) {
                  clearProjectModeUI();
                  enterHero();
                }
                refreshProjectList();
              }
            },
          },
        ]);
      });
      item.appendChild(menuBtn);

      item.addEventListener('click', async () => {
        try {
          const messages = await window.pywebview.api.open_project(proj.path);
          activeProjectPath = proj.path;
          activeConversationId = null; // project threads aren't part of the regular Chats list
          log.innerHTML = '';
          enterActiveChat();
          setProjectModeUI(proj.name);
          messages.forEach(m => addMessage(m.role, m.content));
          renderProjectList(allProjects);
          renderChatList(allConversations);
        } catch (err) {
          console.error('open_project failed:', err);
        }
      });
      projectList.appendChild(item);
    });
  }

  let allProjects = [];
  async function refreshProjectList() {
    try {
      const root = await window.pywebview.api.get_projects_root();
      if (!root) {
        projectList.innerHTML = '<div class="chat-list-empty">No projects folder set yet.</div>';
        return;
      }
      allProjects = await window.pywebview.api.list_projects();
      renderProjectList(allProjects);
    } catch (err) {
      console.error('list_projects failed:', err);
    }
  }

  document.getElementById('chooseProjectsRootBtn').addEventListener('click', async () => {
    try {
      const chosen = await window.pywebview.api.choose_projects_root();
      if (chosen) refreshProjectList();
    } catch (err) {
      console.error('choose_projects_root failed:', err);
    }
  });

  refreshProjectList();

  // Project mode changes what the agent selector shows (and disables it,
  // since a project always implies coding-with-file-access regardless of
  // manual selection). The agent that was active before entering project
  // mode is remembered and restored on exit, rather than resetting to Main.
  let agentBeforeProjectMode = 'main';

  function setProjectModeUI(projectName) {
    agentBeforeProjectMode = agentSelect.disabled ? agentBeforeProjectMode : agentSelect.value;
    agentSelect.innerHTML = `<option value="project">Project: ${projectName}</option>`;
    agentSelect.disabled = true;
  }

  function clearProjectModeUI() {
    activeProjectPath = null;
    if (!agentSelect.disabled) return; // wasn't in project mode - nothing to restore,
                                        // and nothing to protect the user's current
                                        // agent selection from
    agentSelect.disabled = false;
    agentSelect.innerHTML = `
      <option value="main">Main</option>
      <option value="coding">Coding</option>
    `;
    agentSelect.value = agentBeforeProjectMode;
  }

  // ---- Window controls ----
  document.getElementById('minimizeBtn').addEventListener('click', async () => {
    try { await window.pywebview.api.minimize_window(); } catch (err) { console.error(err); }
  });
  document.getElementById('maximizeBtn').addEventListener('click', async () => {
    try { await window.pywebview.api.toggle_maximize_window(); } catch (err) { console.error(err); }
  });
  document.getElementById('closeBtn').addEventListener('click', async () => {
    try { await window.pywebview.api.hide_window(); } catch (err) { console.error(err); }
  });
</script>

</body>
</html>
