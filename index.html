<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #0a0e17;
    --panel: #0d1220;
    --line: #1b2a3a;
    --line-bright: #2a4356;
    --accent: #4fd8ff;
    --accent-dim: #2a6b80;
    --text: #e8f4ff;
    --text-dim: #6b8299;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* --- Header --- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .wordmark {
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    margin-left: auto;
  }

  .status-text {
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  /* --- Central ring (the one signature animated element) --- */
  .ring-wrap {
    display: flex;
    justify-content: center;
    padding: 28px 0 8px;
    flex-shrink: 0;
  }

  .ring {
    width: 64px;
    height: 64px;
  }

  .ring circle {
    fill: none;
    stroke: var(--accent-dim);
    stroke-width: 2;
  }

  .ring .core {
    fill: var(--accent);
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }

  .ring.thinking .core {
    animation: pulse 1s ease-in-out infinite;
  }

  .ring.thinking circle {
    animation: rotate 2.2s linear infinite;
    stroke-dasharray: 90 130;
    transform-origin: center;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  /* --- Conversation log --- */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg {
    max-width: 70%;
    line-height: 1.5;
    font-size: 14px;
  }

  .msg.user {
    align-self: flex-end;
    text-align: right;
    color: var(--text);
    border-right: 2px solid var(--line-bright);
    padding-right: 12px;
  }

  .msg.jarvis {
    align-self: flex-start;
    color: var(--accent);
    border-left: 2px solid var(--accent-dim);
    padding-left: 12px;
  }

  .msg .label {
    display: block;
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  /* --- Input bar --- */
  .input-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }

  .input-bracket {
    color: var(--accent-dim);
    font-family: "Consolas", "SF Mono", monospace;
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 8px 0;
  }

  #input::placeholder {
    color: var(--text-dim);
  }

  .hint {
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* Scrollbar - keep it quiet */
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }
  .log::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

  <header>
    <span class="wordmark">J.A.R.V.I.S.</span>
    <span class="status-text" id="statusText">ONLINE</span>
    <span class="status-dot"></span>
  </header>

  <div class="ring-wrap">
    <svg class="ring" id="ring" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="26"></circle>
      <circle class="core" cx="32" cy="32" r="6"></circle>
    </svg>
  </div>

  <div class="log" id="log"></div>

  <div class="input-bar">
    <span class="input-bracket">&gt;</span>
    <input id="input" type="text" placeholder="Speak, and I shall listen." autofocus>
    <span class="hint">ENTER</span>
  </div>

<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const ring = document.getElementById('ring');
  const statusText = document.getElementById('statusText');

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = role === 'user' ? 'YOU' : 'JARVIS';
    div.appendChild(label);
    div.appendChild(document.createTextNode(text));
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function setThinking(isThinking) {
    ring.classList.toggle('thinking', isThinking);
    statusText.textContent = isThinking ? 'THINKING' : 'ONLINE';
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage('user', text);
    setThinking(true);
    try {
      const reply = await window.pywebview.api.send_message(text);
      addMessage('jarvis', reply);
    } catch (err) {
      addMessage('jarvis', 'I encountered an error: ' + err);
    } finally {
      setThinking(false);
      input.focus();
    }
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Fetch the startup greeting once pywebview's API bridge is ready.
  window.addEventListener('pywebviewready', async () => {
    setThinking(true);
    const greeting = await window.pywebview.api.get_greeting();
    setThinking(false);
    addMessage('jarvis', greeting);
  });
</script>

</body>
</html>
