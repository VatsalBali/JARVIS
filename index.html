<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORACLE</title>
<style>
  :root {
    --bg: #060a10;
    --panel: #0b111a;
    --panel-alt: #0e1520;
    --line: #1c2733;
    --line-bright: #2c4353;
    --accent: #5fd8e8;
    --accent-dim: #2c5560;
    --accent-glow: rgba(95, 216, 232, 0.35);
    --text: #e7f1f5;
    --text-dim: #6f8794;
    --text-faint: #3f515c;
    --warn: #e8b45f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  .mono {
    font-family: "Consolas", "SF Mono", monospace;
  }

  /* ============ SHELL ============ */
  .shell {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100%;
  }

  /* ============ TOP BAR ============ */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding: 14px 24px;
    flex-shrink: 0;
  }

  .clock {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }

  .icon-btn {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint);
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-dim); }

  /* ============ BODY GRID ============ */
  .body {
    display: grid;
    grid-template-columns: 1fr;
    overflow: hidden;
  }

  /* ============ MAIN COLUMN (centered) ============ */
  .main-col {
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .listening-panel {
    padding: 22px 28px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  .ring-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .ring {
    width: 180px;
    height: 180px;
  }

  .hud-core-glow {
    opacity: 0.5;
  }

  .hud-outer {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    opacity: 0.85;
    transform-origin: 100px 100px;
  }

  .hud-ticks {
    stroke: var(--accent);
    stroke-width: 1.4;
    opacity: 0.55;
    transform-origin: 100px 100px;
  }

  .hud-inner-ring {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1;
    stroke-dasharray: 3 4;
    opacity: 0.4;
    transform-origin: 100px 100px;
  }

  .hud-spikes {
    stroke: var(--accent);
    stroke-width: 1.2;
    opacity: 0.6;
  }

  .hud-dots {
    fill: var(--accent);
    opacity: 0.7;
  }

  /* Idle: slow continuous rotation, faint glow - a quiet "always on" feel. */
  .ring:not(.thinking) .hud-outer { animation: hudRotate 40s linear infinite; }
  .ring:not(.thinking) .hud-ticks { animation: hudRotate 60s linear infinite reverse; }
  .ring:not(.thinking) .hud-inner-ring { animation: hudRotate 50s linear infinite; }
  .ring:not(.thinking) .hud-core-glow { animation: hudPulseIdle 3.6s ease-in-out infinite; }

  /* Thinking: faster rotation, brighter glow - the one clear "it's working" signal. */
  .ring.thinking .hud-outer { animation: hudRotate 6s linear infinite; opacity: 1; }
  .ring.thinking .hud-ticks { animation: hudRotate 9s linear infinite reverse; opacity: 0.8; }
  .ring.thinking .hud-inner-ring { animation: hudRotate 7s linear infinite; }
  .ring.thinking .hud-core-glow { animation: hudPulseThinking 1s ease-in-out infinite; }

  @keyframes hudRotate {
    to { transform: rotate(360deg); }
  }

  @keyframes hudPulseIdle {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.6; }
  }

  @keyframes hudPulseThinking {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }

  .ring-status {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>

<script>
  function pad(n) { return n.toString().padStart(2, '0'); }

  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);

  // The ring and ring-status themselves are updated from Python (ui.py's
  // _run_js calls) during wake-word activation - this window has no
  // conversation logic of its own anymore, just the HUD visual and two
  // buttons to control the separate chat window / tray visibility.

  const chatBtn = document.getElementById('chatBtn');
  chatBtn.addEventListener('click', async () => {
    try { await window.pywebview.api.show_chat_window(); } catch (err) { console.error(err); }
  });

  const hideBtn = document.getElementById('hideBtn');
  hideBtn.addEventListener('click', async () => {
    try { await window.pywebview.api.hide_window(); } catch (err) { console.error(err); }
  });
</script>

</html>
