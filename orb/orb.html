<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src ws://127.0.0.1:*; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>ORACLE</title>
<link rel="stylesheet" href="node_modules/@fontsource/chakra-petch/600.css">

    <canvas id="lens"></canvas>
